name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install kivy numpy pandas
          sudo apt update
          sudo apt install -y zip unzip wget

      - name: Build APK with p4a
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          recipe: python3,kivy,numpy,pandas
          arch: arm64-v8a
          title: QuantAI
          package: com.quant.ai
          version: 1.0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantAI-APK
          path: bin/*.apk
